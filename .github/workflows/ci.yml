name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - run: node dist/cli/index.js doctor

  # Exercises the container isolation profile against a real Docker daemon (no network,
  # read-only root, no host environment). Fails if the live test is skipped instead of run.
  docker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Pin the image by digest
        run: |
          docker pull node:22-alpine
          echo "JARVIS_DOCKER_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' node:22-alpine)" >> "$GITHUB_ENV"

      - name: Live isolation test
        shell: bash
        run: |
          npx vitest run tests/integration/docker-live.test.ts 2>&1 | tee live.log
          grep -Eq "1 passed" live.log
          ! grep -Eq "skipped" live.log
